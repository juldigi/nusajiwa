name: NUSAJIWA Tamagotchi Quality

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script_32.js'
      - 'script_33.js'
      - 'nj89-ten.js'
      - 'nj90-forty.js'
      - 'nj94-fauna.js'
      - 'nj96-fauna.js'
      - 'nj98-mistis-batch1.js'
      - 'nj99-folklore-batch2.js'
      - 'nj100-myth-batch3.js'
      - 'nj101-ritual-batch4.js'
      - 'nj102-regional-batch5.js'
      - 'nj103-cryptid-batch6.js'
      - 'nj104-regional-batch7.js'
      - 'nj105-urban-batch8.js'
      - 'nj97-render-guard.js'
      - 'nj95-visual-audit.js'
      - 'nj642-living.js'
      - 'script_34.js'
      - 'css_35.css'
      - 'nj42-bridge.js'
      - 'nj42-bridge.css'
      - 'nj642-living.css'
      - 'tamagotchi-3d.js'
      - 'tamagotchi-3d.css'
      - 'nusajiwa-adventure.js'
      - 'nusajiwa-adventure.css'
      - 'tests/**'
      - '.github/workflows/tamagotchi-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 300 Identities · Gameplay · Platformer · Encyclopedia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse core JavaScript
        run: |
          node --check script_32.js
          node --check script_33.js
          node --check tamagotchi-3d.js
          node --check nusajiwa-adventure.js
          node --check nj89-ten.js
          node --check nj90-forty.js
          node --check nj94-fauna.js
          node --check nj96-fauna.js
          node --check nj98-mistis-batch1.js
          node --check nj99-folklore-batch2.js
          node --check nj100-myth-batch3.js
          node --check nj101-ritual-batch4.js
          node --check nj102-regional-batch5.js
          node --check nj103-cryptid-batch6.js
          node --check nj104-regional-batch7.js
          node --check nj105-urban-batch8.js
          node --check nj97-render-guard.js
          node --check nj95-visual-audit.js
          node --check nj642-living.js
          node --check script_34.js
          node --check nj42-bridge.js
      - name: Verify game and collection invariants
        run: node --test tests/*.mjs
