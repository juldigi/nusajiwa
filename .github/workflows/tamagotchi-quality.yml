name: NUSAJIWA Tamagotchi Quality

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script_32.js'
      - 'script_33.js'
      - 'nj89-ten.js'
      - 'nj90-forty.js'
      - 'nj94-fauna.js'
      - 'nj96-fauna.js'
      - 'nj95-visual-audit.js'
      - 'nj642-living.js'
      - 'nj642-living.css'
      - 'tamagotchi-3d.js'
      - 'tamagotchi-3d.css'
      - 'nusajiwa-adventure.js'
      - 'nusajiwa-adventure.css'
      - 'tests/**'
      - '.github/workflows/tamagotchi-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 300 Identities · Gameplay · Platformer · Encyclopedia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse core JavaScript
        run: |
          node --check script_32.js
          node --check script_33.js
          node --check tamagotchi-3d.js
          node --check nusajiwa-adventure.js
          node --check nj89-ten.js
          node --check nj90-forty.js
          node --check nj94-fauna.js
          node --check nj96-fauna.js
          node --check nj95-visual-audit.js
          node --check nj642-living.js
      - name: Verify game and collection invariants
        run: node --test tests/*.mjs
