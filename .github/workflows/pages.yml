name: Deploy NUSAJIWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in script_*.js; do node --check "$file"; done
          node --check tamagotchi-3d.js
          node --check nusajiwa-adventure.js
          node --check nj89-ten.js
          node --check nj90-forty.js
          node --check nj94-fauna.js
          node --check nj96-fauna.js
          node --check nj98-mistis-batch1.js
          node --check nj99-folklore-batch2.js
          node --check nj100-myth-batch3.js
          node --check nj97-render-guard.js
          node --check nj95-visual-audit.js
          node --check nj642-living.js
          node --check script_34.js
          node --check nj42-bridge.js
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete gameplay regression suite before publication
        run: node --test tests/*.mjs
      - name: Validate deployment asset references
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/<(?:script|link)\b[^>]*?\b(?:src|href)="(\.\/[^"]+)"/g)].map(x=>x[1].split('?')[0].slice(2));
          const missing = refs.filter(x=>!fs.existsSync(x));
          const duplicate = refs.filter((x,i)=>refs.indexOf(x)!==i);
          if(missing.length) throw Error('Missing deployment assets: '+missing.join(', '));
          if(duplicate.length) throw Error('Repeated asset references: '+[...new Set(duplicate)].join(', '));
          for(const file of ['tamagotchi-3d.js','nusajiwa-adventure.js','script_32.js','script_33.js']){
            if(!refs.includes(file)) throw Error('Missing core runtime reference: '+file);
          }
          console.log('Validated',refs.length,'script/style asset references');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html atlas-evolusi.html script_*.js nj89-ten.js nj90-forty.js nj94-fauna.js nj96-fauna.js nj97-render-guard.js nj95-visual-audit.js nj642-living.js pages-fixes.js css_*.css nj642-living.css .nojekyll css_35.css script_34.js nj42-bridge.css nj42-bridge.js _site/
          cp tamagotchi-3d.js tamagotchi-3d.css nusajiwa-adventure.js nusajiwa-adventure.css _site/
          cp -r assets _site/
          cp nj98-mistis-batch1.js nj99-folklore-batch2.js nj100-myth-batch3.js _site/
          cp release.json _site/
      - name: Stamp public build SHA
        run: |
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("release.json","utf8"));fs.writeFileSync("_site/build-info.json",JSON.stringify({project:m.project,version:m.version,commit:process.env.GITHUB_SHA,created_at:new Date().toISOString(),levels:m.runtime.levels,worlds:m.runtime.worlds,identities:m.runtime.identities},null,2)+"\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
